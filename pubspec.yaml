name: kuangan
description: "Kuangan — Personal Finance Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP & Auth
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.8.1

  # Navigation
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.70.2

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Local Storage
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.20.1
  path_provider: ^2.1.5   # <-- HANYA SATU, PAKAI YANG INI

  # UI & Animation
  flutter_animate: ^4.5.0
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  skeletonizer: ^2.1.3
  window_manager: ^0.4.3
  desktop_window: ^0.4.2
  uuid: ^4.5.3
  flutter_dotenv: ^6.0.0
  cuid2: ^4.1.0
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
